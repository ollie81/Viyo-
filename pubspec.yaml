name: viyo
description: Viyo – Creator Motivation + Social App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # Payments
  flutter_stripe: ^11.1.0

  # UI / UX
  share_plus: ^7.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3
  shimmer: ^3.0.0
  timeago: ^3.6.1

  # State
  provider: ^6.1.2
  shared_preferences: ^2.2.0

  # HTTP (for FastAPI AI backend)
  http: ^1.2.1
  dio: ^5.4.0
  uuid: ^4.4.0

  # Observability
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0B1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
