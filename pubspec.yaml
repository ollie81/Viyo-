name: viyo
description: Viyo – Creator Motivation + Social App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # UI / UX
  share_plus: ^7.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3
  shimmer: ^3.0.0
  timeago: ^3.6.1

  # State
  provider: ^6.1.2

  # HTTP (for FastAPI AI backend)
  http: ^1.2.1
  dio: ^5.4.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
