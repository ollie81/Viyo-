name: PR Checks

# Runs on every pull request against main. The only existing workflow
# (main.yml) builds a release APK, but only on push to main or manual
# dispatch — nothing runs against a PR before it merges. This adds a
# fast sanity gate: dependencies resolve, static analysis passes, and
# the test suite passes.
#
# `flutter analyze` fails on ANY issue by default, not just real
# errors — and this codebase carries real pre-existing lint debt
# (mostly `withOpacity` deprecation notices and a few unused
# imports/fields) that predates this workflow and isn't this PR's to
# clean up. --no-fatal-warnings/--no-fatal-infos restores the actual
# intent here: catch real errors, not nitpick existing style.
on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
