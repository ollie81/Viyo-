name: Build Viyo Web (PWA)

# Mirrors main.yml's APK build: runs on every push to main, and can
# also be triggered manually from the Actions tab. Produces the static
# `build/web` output as a downloadable artifact — deploy it to
# whichever static host you use (Railway static site, Firebase
# Hosting, Vercel, GitHub Pages, etc.) by pointing it at this folder's
# contents. flutter_service_worker.js (the PWA offline-caching
# service worker) is generated automatically as part of this build;
# there's nothing to hand-write for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release web (PWA)
        # Real credentials come from GitHub Secrets (Settings -> Secrets
        # and variables -> Actions), never committed to the repo — same
        # secrets main.yml already uses for the APK build.
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AI_BACKEND_URL=${{ secrets.AI_BACKEND_URL }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: viyo-web-build
          path: build/web
