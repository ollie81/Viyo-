name: Build Viyo APK

# Runs on every push to main, and can also be triggered manually from
# the Actions tab (Run workflow button) without needing a push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .   # ✅ Root directory (where pubspec.yaml is)

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # Real credentials come from GitHub Secrets (Settings -> Secrets
        # and variables -> Actions), never committed to the repo. The
        # 4 ANDROID_* ones sign the APK with a real, persistent key
        # (android/app/build.gradle.kts falls back to the debug key
        # when they're unset, so this still builds before they're
        # added) — without them every build gets a fresh throwaway
        # debug key, and Android refuses to install an "update" whose
        # signature doesn't match whatever's already on the device.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AI_BACKEND_URL=${{ secrets.AI_BACKEND_URL }}

      - name: Upload APK
        # --split-per-abi above produces one APK per CPU architecture
        # instead of a single "fat" one bundling all three — a real
        # phone only ever runs one of them, so without this flag two
        # thirds of the download is native code for architectures that
        # device will never use. app-arm64-v8a-release.apk is the one
        # that matters (every Android phone sold in the last several
        # years); the armeabi-v7a/x86_64 ones come along too in case
        # they're ever needed (an old 32-bit phone, an emulator).
        uses: actions/upload-artifact@v4
        with:
          name: viyo-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
