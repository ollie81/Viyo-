name: Build Viyo APK

# Runs on every push to main, and can also be triggered manually from
# the Actions tab (Run workflow button) without needing a push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # Real credentials come from GitHub Secrets (Settings -> Secrets
        # and variables -> Actions), never committed to the repo.
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AI_BACKEND_URL=${{ secrets.AI_BACKEND_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viyo-release-apk
          path: flutter_app/build/app/outputs/app-release.apk
